# Particle simulation configuration.
#
# Every value here matches the constant that was previously hardcoded in the
# source, so running with this file reproduces the original behavior. The loader
# (src/sim_config.cpp) reads a simple subset of YAML: top-level "section:"
# headers, indented "key: value" lines, "[a, b, c]" inline lists, and # comments.
# Any key omitted falls back to the built-in default; an absent file is fine too.

simulation:
  dt: 0.00025
  grid_size: 200
  particles_per_cell: 16
  force_grid_size: 16       # coarse grid for RL body-force output (m×m cells)
  occupancy_grid_size: 32  # fine grid for RL occupancy observation (k×k cells)
  threads_per_block: 256

# Simulation domain bounds. Particles are mapped into grid cells across this
# range; it need not be the historical [-1, 1] x [-1, 1].
domain:
  x_min: -1.0
  x_max:  1.0
  y_min: -1.0
  y_max:  1.0

physics:
  gravity: 9.81
  particle_radius: 0.005
  max_force: 2000.0
  floor_y: -1.0
  ceiling_y: 1.0
  left_wall_x: -1.0
  right_wall_x: 1.0
  # Target coefficient of restitution for the linear spring-dashpot contact
  # model (0 = fully inelastic/critically damped, 1 = perfectly elastic/no
  # damping). See the restitution_to_damping() comment in
  # compute_rhs_kernel.cu for the derivation and literature references.
  restitution: 0.3

materials:
  # Per-material masses, indexed by material id: 0 = wall, 1 = snow, 2 = sled.
  masses: [0.0, 0.2, 0.2]

initialization:
  type: cube                 # "cube" or "two_particles"
  x0: -0.5
  y0: -0.5
  # cube: square grid of "snow" particles plus one "sled" particle on top.
  # Particle spacing is derived from physics.particle_radius.
  cube_length: 1.0
  sled_x: -0.9
  sled_y: 0.9
  sled_vx: 0.4
  sled_vy: 0.0
  sled_material: 2
  particle_material: 1
  # two_particles: vertical offset between the two particles.
  two_particle_separation: 0.1

rendering:
  # Triangles per particle polygon, sent to the client at initialize. The render
  # radius is not a separate field -- it reuses physics.particle_radius.
  num_triangles: 10

drivers:
  port: 8081
  steps_per_frame: 200
  profiling_outer_iters: 10
  profiling_steps_per_iter: 10
  kernel_timing: true

# build/bin/stability_and_accuracy sweep parameters live in stability/config.yaml,
# not here -- this file is for world/profile.

time_integration:
  solver: semi_implicit_euler    # "semi_implicit_euler" or "backward_euler_picard"
  picard_iterations: 3           # number of Picard iterations (only used by backward_euler_picard)

rl:
  # Maximum body-force magnitude the RL agent can apply (N/kg). Distinct from
  # physics.max_force, which caps the particle-particle repulsion penalty.
  max_force: .1
