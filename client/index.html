<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>World</title>
        <script src="world.js" type="module"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: black;
            }
            input[type="checkbox"] {
                width: 30px;
                height: 30px;
            }
            /* Overlaid on top of the canvas (like #hud below) rather than
               taking up layout space, so the canvas can be sized to the full
               window -- see fitCanvasToDomain() in world.js. */
            #controls {
                position: absolute;
                top: 10px;
                left: 10px;
                color: white;
                font-family: sans-serif;
            }
            #hud {
                position: absolute;
                top: 60px;
                left: 10px;
                color: white;
                font-family: monospace;
                font-size: 13px;
                pointer-events: none;
                text-shadow: 1px 1px 2px black;
                line-height: 1.5;
                white-space: pre;
            }
        </style>
    </head>

    <body>
        <div id="controls">
            <input type="checkbox" id="restartButton" name="b1" value="Bike">
            <label for="b1"> Restart </label>
            <input type="checkbox" id="gridButton" name="b2">
            <label for="b2"> Grid </label>
            <input type="checkbox" id="forceFieldButton" name="b3">
            <label for="b3"> Force field </label>
        </div>
        <canvas id="gl-canvas" width="900" height="900"></canvas>
        <div id="hud"></div>
    </body>
</html>
