# Particle simulation configuration, tuned for the stability/stiffness sweep
# in build/bin/stability_and_accuracy.
#
# This is a copy of the root config.yaml (see that file for the full field
# reference) with the "stability:" section set up for a steady-state dt x
# max_force exploration rather than the default fixed-time single-dt sweep.
# The loader (src/sim_config.cpp) reads a simple subset of YAML: top-level
# "section:" headers, indented "key: value" lines, "[a, b, c]" inline lists,
# and # comments. Any key omitted falls back to the built-in default.

simulation:
  dt: 0.0001
  grid_size: 200
  particles_per_cell: 1000
  force_grid_size: 16       # coarse grid for RL body-force output (m×m cells)
  occupancy_grid_size: 32  # fine grid for RL occupancy observation (k×k cells)
  threads_per_block: 256

# Simulation domain bounds. Particles are mapped into grid cells across this
# range; it need not be the historical [-1, 1] x [-1, 1].
domain:
  x_min: -1.0
  x_max: 1.0
  y_min: -1.0
  y_max: 1.0

physics:
  gravity: 9.81
  particle_radius: 0.005
  max_force: 8
  floor_y: -1.0
  ceiling_y: 1.0
  left_wall_x: -1.0
  right_wall_x: 1.0

materials:
  # Per-material masses, indexed by material id: 0 = wall, 1 = snow, 2 = sled.
  masses: [0.0, 0.01, 0.01]

initialization:
  type: cube                 # "cube" or "two_particles"
  x0: -0.5
  y0: -0.5
  # cube: square grid of "snow" particles plus one "sled" particle on top.
  # Particle spacing is derived from physics.particle_radius.
  cube_length: 1.0
  sled_x: -0.9
  sled_y: 0.9
  sled_vx: 0.4
  sled_vy: 0.0
  sled_material: 2
  particle_material: 1
  # two_particles: vertical offset between the two particles.
  two_particle_separation: 0.1

rendering:
  # Triangles per particle polygon, sent to the client at initialize. The render
  # radius is not a separate field -- it reuses physics.particle_radius.
  num_triangles: 20

drivers:
  port: 8081
  steps_per_frame: 50
  profiling_outer_iters: 10
  profiling_steps_per_iter: 10
  kernel_timing: true

# Sweep parameters for build/bin/stability_and_accuracy. This config runs the
# steady-state x max_force stiffness exploration: for every (dt, max_force)
# cell, keep stepping (up to sim_time) until the max particle acceleration
# drops below acceleration_cutoff * gravity, checking every
# steps_per_steadiness_check steps. Produces stability_results.dat and a
# stability_plot.png (red = went unstable, green = reached steady state,
# yellow = ran to sim_time without either).
stability:
  mode: steady_state
  sim_time: 1.
  dt_sweep: [0.1, 0.05, 0.01, 0.005, 0.001, 0.0005, 0.0001]
  max_force_sweep: [10.0, 30.0, 100.0, 300.0, 1000.0]
  acceleration_cutoff: 0.01
  steps_per_steadiness_check: 10

time_integration:
  solver: semi_implicit_euler    # "semi_implicit_euler" or "backward_euler_picard"
  picard_iterations: 3           # number of Picard iterations (only used by backward_euler_picard)

rl:
  # Maximum body-force magnitude the RL agent can apply (N/kg). Distinct from
  # physics.max_force, which caps the particle-particle repulsion penalty.
  max_force: .1
