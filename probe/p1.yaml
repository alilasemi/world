# PROBE p1: 32,768 grains at dt=1e-3.
# Generated by a probe sweep; see CLAUDE.md. radius 0.03 m, max_force 12000 N, so the
# contact stiffness is 4e+05 N/m and a grain of 8.11 kg gets exactly 20 steps per
# contact period at dt=1e-3. Peak interpenetration on impact is 0.36 radii, against
# 0.44 for the checked-in interactive config.
simulation:
  dt: 0.001
  collision_grid_size_x: 167
  collision_grid_size_y: 167
  collision_grid_size_z: 44
  particles_per_cell: 8
  threads_per_block: 256
  density_grid_size_x: 32
  density_grid_size_y: 32
  density_grid_size_z: 16
domain:
  x_min: -5.0
  x_max:  5.0
  y_min: -5.0
  y_max:  5.0
  z_min: -5.0
  z_max:  -2.341
physics:
  gravity: 9.81
  particle_radius: 0.03
  max_force: 12000.0
  floor_z:    -5.0
  ceiling_z:   -2.341
  wall_x_min: -5.0
  wall_x_max:  5.0
  wall_y_min: -5.0
  wall_y_max:  5.0
  restitution: 0.3
  friction: 0.4
materials:
  masses: [0.0, 8.1057]
initialization:
  type: cube
  x0: -0.9696
  y0: -0.9696
  z0: -4.4000
  cube_length_x: 1.9392
  cube_length_y: 1.9392
  cube_length_z: 1.9392
  jitter: 0.25
  seed: 12345
  particle_material: 1
drivers:
  steps_per_frame: 100
  profiling_outer_iters: 20
  profiling_steps_per_iter: 100
  kernel_timing: true
dataset:
  sim_time: 2.0
  checkpoints: 10
