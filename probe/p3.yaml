# PROBE p3: 32,768 grains at dt=1e-3.
# Generated by a probe sweep; see CLAUDE.md. radius 0.07 m, max_force 100000 N, so the
# contact stiffness is 1.43e+06 N/m and a grain of 28.95 kg gets exactly 20 steps per
# contact period at dt=1e-3. Peak interpenetration on impact is 0.24 radii, against
# 0.44 for the checked-in interactive config.
simulation:
  dt: 0.001
  collision_grid_size_x: 157
  collision_grid_size_y: 157
  collision_grid_size_z: 44
  particles_per_cell: 8
  threads_per_block: 256
  density_grid_size_x: 32
  density_grid_size_y: 32
  density_grid_size_z: 16
domain:
  x_min: -11.0
  x_max:  11.0
  y_min: -11.0
  y_max:  11.0
  z_min: -11.0
  z_max:  -4.795
physics:
  gravity: 9.81
  particle_radius: 0.07
  max_force: 100000.0
  floor_z:    -11.0
  ceiling_z:   -4.795
  wall_x_min: -11.0
  wall_x_max:  11.0
  wall_y_min: -11.0
  wall_y_max:  11.0
  restitution: 0.3
  friction: 0.4
materials:
  masses: [0.0, 28.9489]
initialization:
  type: cube
  x0: -2.2624
  y0: -2.2624
  z0: -9.6000
  cube_length_x: 4.5248
  cube_length_y: 4.5248
  cube_length_z: 4.5248
  jitter: 0.25
  seed: 12345
  particle_material: 1
drivers:
  steps_per_frame: 100
  profiling_outer_iters: 20
  profiling_steps_per_iter: 100
  kernel_timing: true
dataset:
  sim_time: 2.0
  checkpoints: 10
