# PROBE p2: 32,768 grains at dt=1e-3.
# Generated by a probe sweep; see CLAUDE.md. radius 0.05 m, max_force 50000 N, so the
# contact stiffness is 1e+06 N/m and a grain of 20.26 kg gets exactly 20 steps per
# contact period at dt=1e-3. Peak interpenetration on impact is 0.28 radii, against
# 0.44 for the checked-in interactive config.
simulation:
  dt: 0.001
  collision_grid_size_x: 200
  collision_grid_size_y: 200
  collision_grid_size_z: 39
  particles_per_cell: 8
  threads_per_block: 256
  density_grid_size_x: 32
  density_grid_size_y: 32
  density_grid_size_z: 16
domain:
  x_min: -10.0
  x_max: 10.0
  y_min: -10.0
  y_max: 10.0
  z_min: -10.0
  z_max: -6.068
physics:
  gravity: 9.81
  particle_radius: 0.05
  max_force: 50000.0
  floor_z: -10.0
  ceiling_z: -6.068
  wall_x_min: -10.0
  wall_x_max: 10.0
  wall_y_min: -10.0
  wall_y_max: 10.0
  restitution: 0.3
  friction: 0.4
materials:
  masses: [0.0, 20.2642]
initialization:
  type: cube
  x0: -1.6160
  y0: -1.6160
  z0: -9.5000
  cube_length_x: 3.2320
  cube_length_y: 3.2320
  cube_length_z: 3.2320
  jitter: 0.25
  seed: 12345
  particle_material: 1
  vx0: 2.0
drivers:
  steps_per_frame: 100
  profiling_outer_iters: 20
  profiling_steps_per_iter: 100
  kernel_timing: true
dataset:
  sim_time: 2.0
  checkpoints: 10
